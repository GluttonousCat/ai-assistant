app:
  name: finance-agent
  version: 2.0.0
  host: 127.0.0.1
  port: 9001

# Per-purpose model settings.
llm:
  enable_thinking: true
  max_tokens: 32768
  models:
    default:
      model: deepseek-v4.1-flash-1017
    agent:
      model: deepseek-v4.1-flash-1017
    extract:
      model: deepseek-v4.1-flash-1017
    nl2sql:
      model: deepseek-v4.1-flash-1017
      enable_thinking: false
      max_tokens: 4096
    analysis:
      model: deepseek-v4.1-flash-1017
    vision:
      model: qwen3.8-omni-flash
      enable_thinking: false
    embedding:
      model: text-embedding-v3


schedule:
  sync_hour: 17               # Trading days at 17:00 Asia/Shanghai
  sync_minute: 0
  enabled: true

intraday_watch:
  enabled: true               # Trading days: 10:32/11:32/14:02/15:02 Asia/Shanghai
  workers: 4                 # Native 60F closes + 120 seconds for provider settlement

# Collection intervals in seconds.
zsxq:
  crawl_interval_min: 1.5
  crawl_interval_max: 2.5
  download_long_sleep_min: 60
  download_long_sleep_max: 120

# Collection times in Asia/Shanghai.
zsxq_schedule:
  enabled: true
  run_hours: [0, 12]

offpeak_processing:
  enabled: true                # Background model work, 22:00–08:00 Asia/Shanghai

report_digest:
  enabled: true                # Daily at 07:30 Asia/Shanghai, including weekends

logging:
  level: INFO
  dir: logs
  backup_count: 30

agent:
  fast_lane:
    enabled: false             # Route simple queries directly to SQL.
  sandbox:
    max_rounds: 8
    max_result_chars: 4000      # Characters per tool result.
    repeat_limit: 3             # Identical tool and arguments.
    max_same_tool_calls: 4      # Report lookups count once per batch.
    max_report_batch_size: 12   # Requests per report tool per batch.
    default_tool_timeout: 120   # Seconds.
    tool_timeouts:
      extract_document: 600
      read_report: 180          # Includes optional model Q&A.
      analyze_chain: 300
  trajectory:
    enabled: true
    retention_days: 30          # Zero keeps all traces.
  domains:
    financial:
      label: 财务数据
      tools: [query_financials, query_main_business, valuation_percentile,
              query_dividend, query_audit_opinion, disclosure_calendar,
              analyze_cashflow, dupont_analysis, query_intraday]
      keywords: [60F, 60f, 30F, 30f, 分钟, 营收, 营业收入, 净利润, 毛利率, 净利率, roe, 净资产收益率, 市盈率,
                 市净率, 股价, 收盘价, 市值, 换手率, 资产负债率, 流动比率, 速动比率,
                 每股收益, 营业利润, 经营现金流, 现金流, 总资产, 商誉, eps, 成交额,
                 靠什么赚钱, 收入结构, 主营构成, 估值贵不贵, 估值分位, 估值水位, 估值,
                 分红, 派息, 除权, 送转, 审计, 会计师, 财报披露, 披露, 延期,
                 净现比, 利润含金量, 杜邦]
      prompt: |-
        你是财务数据子Agent, 配备 9 个数据工具。
        分钟K线/60F使用query_intraday，禁止用日线替代。
        时间表述 (最近三年/2024年报) 与指标别名交给工具处理;
        查当期数值/时序/对比/行业排名用 query_financials,
        收入结构用 query_main_business, 历史估值水位用 valuation_percentile;
        分红派息送转与除权日用 query_dividend,
        审计意见/事务所/费用用 query_audit_opinion,
        财报预约披露与延期用 disclosure_calendar,
        现金流质量(净现比/收现比)用 analyze_cashflow,
        ROE三因子分解用 dupont_analysis。
        需要研报观点/盈利预测/产业链/量化/排雷等域外能力时,
        调用 escalate_to_full_agent 说明。
    report:
      label: 研报观点
      tools: [search_reports, read_report, get_forecasts, summarize_sell_side,
              extract_document]
      keywords: [研报, 解读, 评级, 目标价, 盈利预测, 观点, 黄金, 原油, 大宗商品,
                 贵金属, 分析师, 券商, 上调, 下调, 分歧,
                 卖方观点, 一致预期, 券商怎么看, 覆盖机构]
      prompt: |-
        你是研报观点子Agent。先 search_reports 检索清单 (关键词或标的),
        跨篇综述先按用户关注的主题选取代表报告，并行用 read_report 读正文后再归纳。相同附件只计一份观点。
        只有标题命中或达到阅读额度时说明本轮未读。按读取结果标注已识别页数、历史文字待核对或附件待处理。
        未来期间盈利预测与分歧度用 get_forecasts (历史兑现校验是域外工具, 需要就升级);
        多家机构观点/目标价汇总用 summarize_sell_side。
        综合多篇观点时标注机构与日期; 平台无覆盖时如实说明, 不臆造观点。
        用户给的本地文件才用 extract_document。
        需要财务数值/产业链/量化等域外能力时调用 escalate_to_full_agent。
    chain:
      label: 产业链与预期差
      tools: [list_chains, analyze_chain, analyze_alpha, industry_peers]
      keywords: [产业链, 链条, 环节, 上游, 下游, 受益环节, 板块挖掘, 受益标的,
                 预期差, 分歧度, 拐点, 同行, 同行业, 行业对比, 行业内, 行业排名]
      prompt: |-
        你是产业链与预期差子Agent。链名拿不准先 list_chains;
        环节→标的映射与环节指数用 analyze_chain — **整链问题只调一次**
        (不带 node 参数即返回全部环节, 严禁按环节逐个调用);
        只有聚焦单环节细节时才带 node 参数补查。
        个股四象限综合 (预测分歧x财务动量x估值分位x研报观点) 用 analyze_alpha。
        同行业横向对比 (估值/成长/盈利排名) 用 industry_peers。
        只要单一维度 (仅估值分位/仅盈利预测) 属域外工具, 需要就升级。
        需要行情/研报细节/排雷等域外能力时调用 escalate_to_full_agent。
    risk:
      label: 风控校验
      tools: [detect_financial_risk, verify_forecasts]
      keywords: [财务风险, 异常检测, 排雷, 财务造假, 风险排查, 财务健康, 预测兑现,
                 预测准不准, 兑现率, 研报可信, 兑现]
      prompt: |-
        你是风控校验子Agent。财务排雷用 detect_financial_risk
        (规则信号仅供筛查, 非审计结论, 回答时带此免责说明);
        券商历史预测与实际值对照用 verify_forecasts
        (只校验人民币口径+已出年报期间)。
        需要财务明细/研报/估值等域外能力时调用 escalate_to_full_agent。
    entity:
      label: 实体与公司档案
      tools: [resolve_stock, get_schema, trading_calendar, query_top_holders,
              query_industry, query_share_structure, get_session_history,
              make_table]
      keywords: [是什么公司, 哪个公司, 属于哪个行业, 什么行业, 行业归属, 股票代码,
                 交易日, 交易日历, 上一交易日, 有什么数据, 数据字典,
                 十大股东, 大股东, 股东, 增持, 减持, 股本, 总股本, 流通盘,
                 成分股, 历史对话, 之前聊过, 上次问, 制表, 做表格, 做成表格]
      prompt: |-
        你是实体与公司档案子Agent, 处理公司身份/行业归属/交易日历/
        平台数据范围类问题。公司身份用 resolve_stock, 数据范围用 get_schema,
        交易日历用 trading_calendar;
        十大股东名单与变动用 query_top_holders,
        申万行业归属与同行业成分清单用 query_industry,
        股本结构变迁用 query_share_structure,
        历史对话回放用 get_session_history, 临时数据制表用 make_table。
        直接用本域工具作答, 简洁准确。
        涉及行情/财务/研报等分析类问题时调用 escalate_to_full_agent 转交。
