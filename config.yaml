# ============================================================
# ai-assistant 统一配置
# 说明: 密钥类敏感信息请放在 .env (不纳入版本控制), 此处只放非敏感配置
# ============================================================

app:
  name: finance-agent
  version: 2.0.0
  host: 0.0.0.0
  port: 8208

# LLM 多模型路由
# 约定: 文本模型统一 deepseek-v4-flash-0731; 多模态(视觉)统一 qwen3.8-flash。
# 各环节按"用途"取模型; 未配置的用途回落 default。后续分流只需改这里, 不动代码。
# 每个用途可单独覆盖 model / api_key / base_url (或环境变量 LLM_<用途>_API_KEY / LLM_<用途>_BASE_URL)。
llm:
  enable_thinking: true          # 思考开关全局默认: 开启最强思考 (深推理)
  max_tokens: 32768             # 输出预算: 思考与正文共用, 必须给足 (小预算会思考耗尽致 content 空)
  models:
    default:
      model: deepseek-v4-flash-0731   # 文本兜底 (与 .env LLM_MODEL 一致, 兼容其覆盖)
    agent:                        # Skill/Agent 推理 (意图识别 L2 / SQL 生成 / 研报解读)
      model: deepseek-v4-flash-0731
    extract:                      # 研报结构化提取 (文件名元数据 / 长文本 JSON)
      model: deepseek-v4-flash-0731
    nl2sql:                       # 快车道 NL2SQL: 结构化短输出, 深思考反而拖慢 (实测4~27s)
      model: deepseek-v4-flash-0731
      enable_thinking: false      # 秒级生成; 只产出一条 SELECT
      max_tokens: 4096
    analysis:                     # 轻量元数据分析 (LLM Analysis)
      model: deepseek-v4-flash-0731
    vision:                       # 多模态: 扫描件 PDF 逐页识别 / 图片理解
      model: qwen3.8-flash        # deepseek 不接收图片输入, 视觉用途必须走 qwen 多模态
      enable_thinking: false      # OCR 逐页高频调用, 关思考省时省钱
    embedding:                    # 向量 (预留)
      model: text-embedding-v3
  temperature: 0.7
  timeout: 60

# 知识星球爬虫默认参数
zsxq:
  crawl_interval_min: 2.0     # 爬取最小间隔(秒)
  crawl_interval_max: 5.0     # 爬取最大间隔(秒)
  long_delay_interval: 15     # 每N页触发一次长休眠
  download_min_delay: 60      # 文件下载最小间隔(秒)
  download_max_delay: 120     # 文件下载最大间隔(秒)

# Tushare 数据抓取参数
tushare:
  rate_limit_sleep: 0.5       # 每次抓取间隔(秒)
  chunk_size: 1000            # 批量入库分块大小

# 每日增量同步调度 (后端常驻即自动执行)
schedule:
  sync_hour: 21               # 每交易日 21:00 自动增量回填 (Tushare 15-16点入库当日)
  sync_minute: 0
  enabled: true               # false 则关闭调度器

# 知识星球研报抓取调度 (每天两轮: 爬话题+文件 -> 同步PG -> LLM提取)
zsxq_schedule:
  enabled: true
  run_hours: [7, 23]          # 07:00 覆盖前一天晚间内容(开机自启后自动补跑), 23:00 覆盖当天

# 日志
logging:
  level: INFO
  dir: logs
  backup_count: 30
