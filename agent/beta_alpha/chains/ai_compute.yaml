# AI算力产业链 (种子模板)
# 趋势倒推: 大模型训练/推理 -> 服务器 -> GPU/HBM/光通信/PCB -> 上游材料/晶圆/封装
# keywords: 用于主营构成(fin.v_main_biz.bz_item)与研报tags匹配
# sw_l2: 申万二级行业兜底 (子串匹配, 兼容"元件Ⅱ"等命名)
chain_id: ai_compute
name: AI算力产业链
desc: 大模型训练与推理需求驱动的算力硬件基础设施
drivers: [大模型训练, 推理需求, 云厂商资本开支, 国产算力]
nodes:
  - {id: server, name: 服务器/整机, keywords: [服务器, 算力系统, AI服务器], sw_l2: [计算机设备]}
  - {id: gpu, name: GPU/AI芯片, keywords: [GPU, 图形处理器, AI芯片, 智能芯片, 加速卡, 算力芯片, 显卡, 处理器, 云端产品线], sw_l2: [半导体]}
  - {id: asic, name: ASIC/定制芯片, keywords: [ASIC, 定制芯片, 推理芯片], sw_l2: [半导体]}
  - {id: hbm, name: 存储/HBM, keywords: [HBM, 高带宽内存, 存储芯片, 内存接口, 存储器], sw_l2: [半导体]}
  - {id: optical, name: 光通信/光模块, keywords: [光模块, 光通信, 光器件, 光芯片, 硅光, 光引擎, 光缆], sw_l2: [通信设备, 元件]}
  - {id: pcb, name: PCB, keywords: [PCB, 印制电路板, 电路板, 线路板, 通讯市场板, 汽车板, 数通板], sw_l2: [元件]}
  - {id: ccl, name: 覆铜板CCL, keywords: [覆铜板, CCL], sw_l2: [元件]}
  - {id: material, name: 上游电子材料, keywords: [电子布, 电子纱, 铜箔, 电子树脂, 环氧树脂, 特种树脂, 铜球, 玻纤布], sw_l2: [元件, 电子化学品]}
  - {id: wafer, name: 晶圆制造/先进封装, keywords: [晶圆, 代工, 先进封装, 封装测试, 封测], sw_l2: [半导体]}
  - {id: cooling, name: 散热/液冷, keywords: [液冷, 散热, 温控, 风冷, 冷板]}
  - {id: power, name: 电源/配电, keywords: [电源, UPS, 高压直流, HVDC, 配电], sw_l2: [电源设备, 电网设备]}
  - {id: idc, name: IDC数据中心, keywords: [IDC, 数据中心, 机柜, 机房], sw_l2: [IT服务, 通信服务]}
# edges: [上游, 下游]
edges:
  - [material, ccl]
  - [ccl, pcb]
  - [pcb, server]
  - [asic, server]
  - [gpu, server]
  - [hbm, gpu]
  - [wafer, gpu]
  - [wafer, asic]
  - [optical, idc]
  - [cooling, server]
  - [power, idc]
  - [server, idc]
