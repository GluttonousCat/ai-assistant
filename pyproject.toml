[project]
name = "ai-assistant"
version = "2.0.0"
description = "智能投研助手 - 知识星球爬虫 + Tushare数据分析 + Agent ChatBI"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",

    # HTTP / 爬虫
    "requests>=2.28.0",

    # 数据 / 分析
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "mysql-connector-python>=8.0.0",
    "psycopg2-binary>=2.9.0",
    "tushare>=1.4.0",
    "akshare>=1.12.0",
    "chinese-calendar>=1.10.0",

    # LLM / Agent
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.1.0",

    # 配置 / 日志
    "pyyaml>=6.0",
    "loguru>=0.7.0",

    # SQL 解析/校验 (Text-to-SQL)
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ai-assistant = "app:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "agent*", "core*", "skills*", "storage*", "tools*", "utils*", "llm*"]
